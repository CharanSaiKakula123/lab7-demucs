apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: us-central1-docker.pkg.dev/cu-csci-5253-datacenter-510213/demucs/worker:v3
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: MINIO_HOST
              value: "minio:9000"
            - name: MINIO_ACCESS_KEY
              value: "rootuser"
            - name: MINIO_SECRET_KEY
              value: "rootpass123"
            - name: MINIO_SECURE
              value: "false"
            - name: QUEUE_BUCKET
              value: "queue"
            - name: OUTPUT_BUCKET
              value: "output"
          resources:
            requests:
              cpu: "1"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 10Gi
