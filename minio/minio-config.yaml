mode: standalone

fullnameOverride: myminio-proj

rootUser: "rootuser"
rootPassword: "rootpass123"

replicas: 1
persistence:
  enabled: false

resources:
  requests:
    memory: 1Gi

service:
  type: ClusterIP
  port: "9000"

buckets:
  - name: queue
    policy: none
    purge: false
  - name: output
    policy: none
    purge: false
